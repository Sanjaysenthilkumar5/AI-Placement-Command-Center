version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-placement-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./placement_command_center.db
      - SECRET_KEY=super-secret-jwt-key-for-ai-placement-command-center-2026-prod
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - backend-uploads:/app/uploads
      - backend-db:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-placement-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-uploads:
  backend-db:
